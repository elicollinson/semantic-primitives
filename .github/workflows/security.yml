name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: elicollinson/security-workflows/.github/workflows/scan.yml@fcde5fab2bef7d5305b6d10a6fd45e5628b4c484 # v1.0.0

  # Single required check for the ruleset: passes only if every scan job passed.
  security:
    if: ${{ always() }}
    needs: scan
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - env:
          RESULT: ${{ needs.scan.result }}
        run: test "$RESULT" = success
